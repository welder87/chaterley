<div class="chat-container">
    <div class="container-fluid h-100">
        <div class="row h-100">
            <!-- Main Chat Area -->
            <div class="col-md-9 col-lg-10 d-flex flex-column h-100 p-0">
                <!-- Header -->
                <div class="bg-white border-bottom p-3">
                    <div
                        class="d-flex align-items-center justify-content-between"
                    >
                        <div>
                            <a
                                href="/"
                                class="text-decoration-none text-dark me-3"
                            >
                                <i class="bi bi-arrow-left"></i>
                            </a>
                            <i class="bi bi-hash fs-4"></i>
                            <strong class="fs-4">{{.Name}}</strong>
                        </div>
                        <div>
                            <i class="bi bi-people"></i>
                            <span id="userCount">0</span> online
                        </div>
                    </div>
                </div>

                <!-- Messages Area -->
                <div class="messages-area" id="messages">
                    <div class="text-center text-muted">
                        <i class="bi bi-chat-dots display-6"></i>
                        <p class="mt-2">Welcome to #{{.Name}}!</p>
                    </div>
                    {{range .Messages}}
                    <div class="message user">
                        <div class="message-bubble">
                            <small class="fw-bold"> {{.AuthorLogin}} </small
                            ><br />
                            {{.Content}}
                        </div>
                    </div>
                    {{end}}
                </div>

                <!-- Input Area -->
                <div class="input-area">
                    <div class="input-group">
                        <input
                            type="text"
                            id="messageInput"
                            class="form-control"
                            placeholder="Type a message..."
                            autocomplete="off"
                        />
                        <button class="btn btn-primary" onclick="sendMessage()">
                            <i class="bi bi-send"></i> Отправить
                        </button>
                    </div>
                </div>
            </div>

            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 sidebar d-none d-md-block p-3">
                <h6 class="text-muted mb-3">
                    <i class="bi bi-people-fill"></i> Online
                </h6>
                <div id="usersList">
                    <div class="text-muted small">Loading...</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const roomName = "{{.RoomName}}";
    let ws = new WebSocket(`ws://localhost:3000/ws/`);
    let userName =
        localStorage.getItem("chat_user") ||
        prompt("Enter your name:") ||
        "Anonymous";
    localStorage.setItem("chat_user", userName);

    ws.onopen = () => {
        ws.send(JSON.stringify({ type: "join", name: userName }));
    };

    ws.onmessage = (event) => {
        const data = event.data;
        let messageHtml;

        if (data.startsWith("User joined") || data.startsWith("User left")) {
            messageHtml = `
                    <div class="message system">
                        <span class="badge bg-secondary bg-opacity-25 text-dark">
                            <i class="bi bi-info-circle"></i> ${data}
                        </span>
                    </div>
                `;
        } else if (data.startsWith(userName + ":")) {
            // My message
            const text = data.substring(userName.length + 2);
            messageHtml = `
                    <div class="message user justify-content-end">
                        <div class="message-bubble">
                            ${text}
                        </div>
                    </div>
                `;
        } else {
            // Other user's message
            const [user, ...messageParts] = data.split(":");
            const text = messageParts.join(":");
            messageHtml = `
                    <div class="message user">
                        <div class="message-bubble">
                            <small class="fw-bold">${user}</small><br>
                            ${text}
                        </div>
                    </div>
                `;
        }

        const messagesDiv = document.getElementById("messages");
        messagesDiv.insertAdjacentHTML("beforeend", messageHtml);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    };

    function sendMessage() {
        const input = document.getElementById("messageInput");
        if (input.value.trim()) {
            ws.send(`${userName}: ${input.value}`);
            input.value = "";
            input.focus();
        }
    }

    document
        .getElementById("messageInput")
        .addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage();
        });

    // Update online users count periodically
    setInterval(() => {
        const messages = document.querySelectorAll(".message.system");
        const users = new Set();
        document
            .querySelectorAll(".message.user .message-bubble small")
            .forEach((el) => {
                users.add(el.textContent);
            });
        document.getElementById("userCount").textContent = users.size;
    }, 2000);
</script>
