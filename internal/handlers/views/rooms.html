<div class="card shadow-sm">
    <div class="card-header bg-white">
        <h5 class="mb-0">
            <i class="bi bi-door-open"></i>Доступно комнат
            <span class="badge bg-secondary rounded-pill">{{len .Rooms}}</span>
        </h5>
    </div>
    <div class="card-body p-0" id="rooms">
        {{if .Rooms}}
        <div class="list-group list-group-flush">
            {{range .Rooms}}
            <a
                href="/rooms/{{.RoomID}}"
                class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
            >
                <div><i class="bi bi-hash"></i> {{.Name}}</div>
                <i class="bi bi-chevron-right text-muted"></i>
            </a>
            {{end}}
        </div>
        {{else}}
        <div class="text-center py-5 text-muted">
            <i class="bi bi-inbox display-4"></i>
            <p class="mt-2">No rooms yet. Create the first one!</p>
        </div>
        {{end}}
    </div>
</div>
